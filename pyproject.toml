[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pinterest-downloader"
version = "0.1.0"
description = "Public Pinterest board and pin image downloader"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "playwright>=1.50,<2", "Pillow>=11,<13"]

[project.scripts]
pinterest-downloader = "pinterest_downloader.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
